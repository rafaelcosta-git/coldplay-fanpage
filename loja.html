<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coldplay | Loja Oficial</title>

  <meta name="description" content="Loja de merchandising Coldplay: t-shirts, hoodies, vinis, posters e mais.">
  <meta name="keywords" content="Coldplay, loja, merchandising, t-shirt, hoodie, vinil, poster, xyloband">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .fade-scale {
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .fade-scale.hidden {
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Coldplay</a>

      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
          <li class="nav-item"><a class="nav-link" href="albuns.html">Álbuns</a></li>
          <li class="nav-item"><a class="nav-link" href="tour.html">Tour</a></li>
          <li class="nav-item"><a class="nav-link" href="contactos.html">Contactos</a></li>

          <li class="nav-item"> <a class="nav-link active" href="loja.html">
              Loja
              <span class="badge bg-warning text-dark ms-1" id="cart-count">0</span>
              <i class="fa-solid fa-cart-shopping ms-1"></i>
            </a>
          </li>
          <li class="nav-item"><a class="nav-link" href="calculadora.html">Cálculo</a></li>

        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h1 class="text-center mb-4">Loja Oficial Coldplay</h1>
    <p class="text-center text-white mb-5">Escolhe o teu merchandising favorito.</p>

    <div class="row g-4">

      <!-- PRODUTOS -->
      <section class="col-lg-8">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h4">Produtos</h2>
          <small class="text-light" id="produtos-count"></small>
        </div>

        <!-- === DROPDOWN ADICIONADO AQUI === -->
        <div class="mb-3">
          <label class="form-label text-white">Filtrar por categoria:</label>
          <select id="categoria-select" class="form-select w-50">
            <option value="todos">Todas as categorias</option>
            <option value="tshirt">T-shirts</option>
            <option value="hoodie">Hoodies</option>
            <option value="vinil">Vinis</option>
            <option value="poster">Posters</option>
            <option value="acessorio">Acessórios</option>
            <option value="colecionaveis">Colecionáveis</option>
          </select>
        </div>
        <!-- ================================ -->

        <div class="row g-4" id="produtos-container"></div>

      </section>

      <!-- CARRINHO -->
      <aside class="col-lg-4">
        <div class="card bg-dark text-light shadow">
          <div class="card-body">
            <h2 class="h4 mb-3">
              <i class="fa-solid fa-cart-shopping me-2"></i> Carrinho
            </h2>

            <div id="cart-items">
              <p class="text-muted mb-0">Ainda não há itens.</p>
            </div>

            <hr>

            <div class="d-flex justify-content-between mb-3">
              <span class="fw-bold">Total:</span>
              <span class="fw-bold fs-5" id="cart-total">0 €</span>
            </div>

            <button id="btn-finalizar" class="btn btn-success w-100 mb-2" disabled>Finalizar compra</button>
            <button id="btn-limpar" class="btn btn-outline-light w-100 btn-sm" disabled>Limpar carrinho</button>
            <button onclick="window.location.href='calculadora.html'" class="btn btn-warning w-100 mt-2">Calcular Total</button>


            <small class="text-muted">O carrinho é gravado no navegador.</small>
          </div>
        </div>
      </aside>

    </div>

    <!-- =============================== -->
    <!--   LIGHTBOX ADICIONADO AQUI     -->
    <!-- =============================== -->

    <div id="lightbox" style="
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.7);
      backdrop-filter:blur(4px);
      justify-content:center;
      align-items:center;
      z-index:9999;">
      
      <div id="lightbox-close" style="
        position:absolute;
        top:20px;
        right:30px;
        font-size:40px;
        color:white;
        cursor:pointer;">&times;</div>

      <div id="lightbox-content" style="
        background:white;
        padding:20px;
        border-radius:10px;
        max-width:600px;
        width:90%;
        max-height:80%;
        overflow:auto;
        text-align:center;">
      </div>
    </div>

    <!-- =============================== -->

  </main>

  <footer class="bg-dark text-white text-center p-4 mt-5">
    <p>&copy; 2026 Coldplay Fanpage.</p>

    <div class="footer-social">
      <a href="#" class="text-white me-3"><i class="fab fa-facebook"></i></a>
      <a href="#" class="text-white me-3"><i class="fab fa-instagram"></i></a>
      <a href="#" class="text-white me-3"><i class="fab fa-youtube"></i></a>
      <a href="#" class="text-white me-3"><i class="fab fa-tiktok"></i></a>
      <a href="#" class="text-white me-3"><i class="fab fa-spotify"></i></a>
      <a href="#" class="text-white me-3"><i class="fab fa-apple"></i></a>
      <a href="#" class="text-white"><i class="fab fa-x-twitter"></i></a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/loja.js"></script>
</body>
</html>
